<!doctype html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>WanderPop - Playful Travel Companion</title>

		<!-- Fonts: Outfit (Headings) & Plus Jakarta Sans (Body) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>

		<!-- FontAwesome Icons -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>

		<!-- Tailwind CSS (CDN) -->
		<script src="https://cdn.tailwindcss.com"></script>

		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							bg: '#FFFDF5', // Warm Cream
							fg: '#1E293B', // Slate 800
							muted: '#F1F5F9', // Slate 100
							mutedFg: '#64748B', // Slate 500
							accent: '#8B5CF6', // Vivid Violet
							secondary: '#F472B6', // Hot Pink
							tertiary: '#FBBF24', // Amber/Yellow
							quaternary: '#34D399', // Emerald/Mint
							border: '#E2E8F0', // Slate 200
						},
						boxShadow: {
							pop: '4px 4px 0px 0px #1E293B',
							'pop-hover': '6px 6px 0px 0px #1E293B',
							'pop-active': '2px 2px 0px 0px #1E293B',
							sticker: '8px 8px 0px 0px #E2E8F0',
							'sticker-pink': '8px 8px 0px 0px #F472B6',
							'sticker-yellow': '8px 8px 0px 0px #FBBF24',
						},
						fontFamily: {
							sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
							display: ['"Outfit"', 'system-ui', 'sans-serif'],
						},
						transitionTimingFunction: {
							bouncy: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
						},
					},
				},
			};
		</script>

		<style type="text/tailwindcss">
			@layer utilities {
				.bg-polka {
					background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
					background-size: 20px 20px;
				}
				.bg-stripes {
					background-image: repeating-linear-gradient(
						45deg,
						transparent,
						transparent 10px,
						#f1f5f9 10px,
						#f1f5f9 20px
					);
				}
				.blob-radius-1 {
					border-radius: 24px 24px 24px 0;
				}
				.blob-radius-2 {
					border-radius: 24px 24px 0 24px;
				}
				.blob-radius-3 {
					border-radius: 24px 0 24px 24px;
				}

				/* UI Components based on Playful Geometric */
				.candy-btn {
					@apply bg-accent text-white font-display font-bold text-lg rounded-full border-2 border-fg shadow-pop 
                       transition-all duration-300 ease-bouncy 
                       hover:shadow-pop-hover hover:-translate-y-1 hover:-translate-x-1 
                       active:shadow-pop-active active:translate-y-0.5 active:translate-x-0.5 
                       flex items-center justify-center gap-2 px-6 py-3 cursor-pointer select-none;
				}
				.candy-btn-secondary {
					@apply bg-white text-fg font-display font-bold text-lg rounded-full border-2 border-fg 
                       transition-all duration-300 ease-bouncy
                       hover:bg-tertiary hover:-translate-y-1 hover:-translate-x-1 hover:shadow-pop
                       active:translate-y-0.5 active:translate-x-0.5 active:shadow-none
                       flex items-center justify-center gap-2 px-6 py-3 cursor-pointer select-none;
				}
				.candy-btn-small {
					@apply px-3 py-1.5 text-sm;
				}

				.sticker-card {
					@apply bg-white border-2 border-fg rounded-xl shadow-sticker relative p-5 mb-5 transition-all;
				}

				.input-candy {
					@apply bg-white border-2 border-slate-300 rounded-lg text-fg focus:border-accent focus:shadow-pop outline-none transition-all duration-300 p-3 w-full font-sans mb-4;
				}
				.label-candy {
					@apply block font-display font-bold uppercase tracking-wide text-xs mb-1.5 text-fg/80;
				}

				/* Hide Scrollbar */
				.no-scrollbar::-webkit-scrollbar {
					display: none;
				}
				.no-scrollbar {
					-ms-overflow-style: none;
					scrollbar-width: none;
				}
			}

			body {
				@apply bg-bg text-fg min-h-screen flex flex-col font-sans selection:bg-accent selection:text-white;
				-webkit-tap-highlight-color: transparent;
			}
		</style>
	</head>
	<body class="bg-polka bg-fixed">
		<header
			class="sticky top-0 z-50 bg-bg/95 backdrop-blur-md border-b-2 border-fg shadow-sm"
		>
			<!-- Privacy Warning Bar -->
			<div
				class="bg-secondary text-white text-[10px] font-bold text-center py-1 px-2 border-b-2 border-fg flex items-center justify-center gap-1.5 tracking-wider"
			>
				<i class="fa-solid fa-triangle-exclamation"></i>
				請勿在此輸入護照號碼、信用卡等敏感資訊
			</div>

			<div
				class="flex justify-between items-center px-4 py-3 max-w-2xl mx-auto w-full"
			>
				<h1
					class="font-display font-extrabold text-2xl tracking-tight flex items-center gap-2 text-fg"
				>
					<div
						class="bg-tertiary w-8 h-8 rounded-full border-2 border-fg flex items-center justify-center shadow-pop"
					>
						<i class="fa-solid fa-plane text-fg text-sm"></i>
					</div>
					WanderPop
				</h1>
				<button
					id="btn-data-modal"
					class="w-10 h-10 border-2 border-fg rounded-full bg-white hover:bg-quaternary shadow-pop hover:-translate-y-0.5 transition-all flex items-center justify-center"
				>
					<i class="fa-solid fa-database"></i>
				</button>
			</div>
		</header>

		<!-- Data Management Modal -->
		<div
			id="modal-data"
			class="fixed inset-0 bg-fg/60 z-[100] hidden flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity"
		>
			<div
				class="bg-white border-2 border-fg rounded-2xl p-6 w-full max-w-sm shadow-sticker-pink relative blob-radius-1 scale-95 transform transition-transform"
				id="modal-data-content"
			>
				<button
					id="btn-close-modal"
					class="absolute -top-3 -right-3 w-8 h-8 bg-white border-2 border-fg rounded-full shadow-pop flex items-center justify-center hover:bg-secondary hover:text-white transition-colors"
				>
					<i class="fa-solid fa-xmark"></i>
				</button>
				<h2
					class="font-display font-bold text-2xl mb-2 flex items-center gap-2"
				>
					<i class="fa-solid fa-hard-drive text-accent"></i>
					資料管理
				</h2>
				<p class="text-sm text-mutedFg mb-6 font-medium">
					所有的旅遊資料都安全地儲存在您的手機瀏覽器中。您可以隨時匯出備份或分享給旅伴。
				</p>

				<div class="flex flex-col gap-4">
					<button id="btn-export" class="candy-btn !bg-tertiary !text-fg">
						<i class="fa-solid fa-file-export"></i> 匯出備份資料 (JSON)
					</button>
					<div class="relative">
						<input
							type="file"
							id="input-import"
							accept=".json"
							class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
						/>
						<button
							class="candy-btn w-full !bg-quaternary !text-fg relative z-0"
						>
							<i class="fa-solid fa-file-import"></i> 匯入還原資料
						</button>
					</div>
					<div class="border-t-2 border-dashed border-border my-2"></div>
					<button
						id="btn-clear"
						class="candy-btn-secondary !text-red-500 !border-red-200 hover:!border-red-500 hover:!bg-red-50"
					>
						<i class="fa-solid fa-trash-can"></i> 清空所有資料
					</button>
				</div>
			</div>
		</div>

		<!-- Image Preview Modal -->
		<div
			id="modal-image"
			class="fixed inset-0 bg-fg/90 z-[110] hidden flex-col items-center justify-center p-4 backdrop-blur-md"
			onclick="this.classList.add('hidden')"
		>
			<img
				id="modal-image-view"
				src=""
				class="max-w-full max-h-[75vh] border-4 border-white rounded-xl shadow-2xl object-contain bg-white"
			/>
			<button class="mt-6 candy-btn-secondary !bg-white">關閉預覽</button>
		</div>

		<main
			id="app-content"
			class="flex-1 w-full max-w-2xl mx-auto p-4 pb-28 relative"
		>
			<!-- Dynamic content injected here -->
		</main>

		<nav
			class="fixed bottom-0 left-0 w-full bg-white border-t-2 border-fg pb-safe z-40 shadow-[0_-4px_0_0_rgba(30,41,59,0.05)]"
		>
			<div
				class="max-w-2xl mx-auto flex justify-around items-center p-2 overflow-x-auto no-scrollbar"
				id="nav-container"
			>
				<!-- Nav buttons injected via JS -->
			</div>
		</nav>

		<script>
			// --- Core State Management ---
			const STORAGE_KEY = 'wanderpop_data_v1';

			// Default Template
			const defaultState = {
				plan: [], // {id, date, time, title, loc, important}
				guide: [], // {id, title, desc, embedUrl}
				wallet: { rate: 0.21, expenses: [] }, // expenses: {id, date, item, jpy, twd, payer, img}
				lists: { checklist: [], memos: [] }, // checklist: {id, text, done}, memos: {id, text}
				info: {
					notes:
						'📝 旅遊注意事項：\n1. 護照請隨身攜帶\n2. 貴重物品請勿離身\n3. 記得帶轉接頭\n\n可點擊上方編輯按鈕修改此處內容！',
				},
				shop: {
					categories: ['美妝', '超市', '衣服', '伴手禮', '電器'],
					items: [],
				}, // items: {id, name, cat, img, couponImg}
			};

			let appState = JSON.parse(localStorage.getItem(STORAGE_KEY));
			if (!appState || !appState.shop) {
				// basic migration/fallback
				appState = JSON.parse(JSON.stringify(defaultState));
				saveState();
			}

			let currentTab = 'PLAN';

			function saveState() {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
			}

			const generateId = () => Math.random().toString(36).substr(2, 9);

			// Canvas Image Compression to Base64
			function compressImage(file, callback) {
				if (!file) return callback(null);
				const reader = new FileReader();
				reader.onload = (e) => {
					const img = new Image();
					img.onload = () => {
						const canvas = document.createElement('canvas');
						const ctx = canvas.getContext('2d');
						let width = img.width;
						let height = img.height;
						const MAX_DIMENSION = 600;

						if (width > height && width > MAX_DIMENSION) {
							height *= MAX_DIMENSION / width;
							width = MAX_DIMENSION;
						} else if (height > MAX_DIMENSION) {
							width *= MAX_DIMENSION / height;
							height = MAX_DIMENSION;
						}

						canvas.width = width;
						canvas.height = height;
						ctx.drawImage(img, 0, 0, width, height);
						callback(canvas.toDataURL('image/jpeg', 0.6)); // Compress
					};
					img.src = e.target.result;
				};
				reader.readAsDataURL(file);
			}

			// Safe Math Evaluation
			function evaluateMath(str) {
				try {
					const sanitized = str.replace(/[^-()\d/*+.]/g, ''); // Allow only math chars
					if (!sanitized) return 0;
					return new Function('return ' + sanitized)();
				} catch (e) {
					return 0;
				}
			}

			// URL to Link Converter
			function linkify(text) {
				const urlRegex = /(https?:\/\/[^\s]+)/g;
				return text.replace(urlRegex, function (url) {
					return `<a href="${url}" target="_blank" class="text-accent font-bold underline decoration-2 underline-offset-2 hover:text-secondary transition-colors inline-flex items-center gap-1"><i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>連結</a>`;
				});
			}

			// --- Render Functions ---

			function renderPlan() {
				// Sort by date then time
				appState.plan.sort(
					(a, b) =>
						a.date.localeCompare(b.date) || a.time.localeCompare(b.time),
				);

				let html = `
                <div class="mb-6 flex justify-between items-end animate-[popIn_0.3s_ease-out]">
                    <h2 class="font-display font-extrabold text-4xl text-fg uppercase tracking-tight">Plan <span class="block text-accent text-lg -mt-1">行程表</span></h2>
                    <div class="w-12 h-12 bg-accent rounded-full flex items-center justify-center shadow-pop transform rotate-12">
                        <i class="fa-solid fa-map text-white text-xl"></i>
                    </div>
                </div>

                <div class="sticker-card !bg-muted blob-radius-2 animate-[popIn_0.4s_ease-out]">
                    <h3 class="font-display font-bold text-lg mb-3 flex items-center gap-2"><i class="fa-solid fa-calendar-plus text-secondary"></i> 新增行程</h3>
                    <form id="form-plan" class="flex flex-col gap-1">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="label-candy">日期</label>
                                <input type="date" id="plan-date" class="input-candy" required>
                            </div>
                            <div>
                                <label class="label-candy">時間</label>
                                <input type="time" id="plan-time" class="input-candy" required>
                            </div>
                        </div>
                        <div>
                            <label class="label-candy">標題/活動</label>
                            <input type="text" id="plan-title" class="input-candy" placeholder="例：抵達機場、和牛燒肉" required>
                        </div>
                        <div>
                            <label class="label-candy">地點 (自動產生地圖連結)</label>
                            <input type="text" id="plan-loc" class="input-candy" placeholder="例：東京鐵塔">
                        </div>
                        <div class="flex items-center gap-2 mb-4 bg-white p-3 border-2 border-border rounded-lg">
                            <input type="checkbox" id="plan-important" class="w-5 h-5 accent-tertiary rounded">
                            <label for="plan-important" class="font-bold text-sm select-none">標記為重要集合/出發時間</label>
                        </div>
                        <button type="submit" class="candy-btn w-full"><i class="fa-solid fa-plus"></i> 加入行程</button>
                    </form>
                </div>
                
                <div class="flex flex-col gap-5 mt-8 relative">
                    <div class="absolute left-[31px] top-0 bottom-0 w-1 bg-border z-0"></div>
            `;

				let currentDate = '';
				appState.plan.forEach((item, index) => {
					if (item.date !== currentDate) {
						html += `<div class="sticky top-[68px] z-10 bg-bg/95 backdrop-blur-sm py-2 font-display font-extrabold text-2xl text-accent border-b-2 border-dashed border-border mt-4 mb-4 pl-1">${item.date}</div>`;
						currentDate = item.date;
					}

					const isImportant = item.important;
					const dotColor = isImportant
						? 'bg-tertiary border-fg'
						: 'bg-white border-accent';
					const cardClass = isImportant
						? 'sticker-card !bg-tertiary shadow-sticker-yellow blob-radius-1 border-2 !ml-14'
						: 'sticker-card !ml-14 shadow-sm hover:shadow-pop';

					const mapLink = item.loc
						? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.loc)}" target="_blank" class="inline-flex items-center gap-1.5 bg-fg text-white text-xs font-bold px-3 py-1.5 rounded-full mt-3 hover:bg-accent transition-colors"><i class="fa-solid fa-location-dot"></i> Google Maps</a>`
						: '';

					html += `
                    <div class="relative animate-[popIn_0.3s_ease-out]" style="animation-delay: ${index * 0.05}s">
                        <div class="absolute left-2 top-6 w-5 h-5 rounded-full border-2 z-10 ${dotColor} shadow-[2px_2px_0px_#1E293B]"></div>
                        <div class="${cardClass} flex gap-3">
                            <div class="font-display font-extrabold text-lg min-w-[55px] pt-0.5 ${isImportant ? 'text-fg' : 'text-mutedFg'}">${item.time}</div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start gap-2">
                                    <h4 class="font-bold text-lg leading-tight break-words">${item.title}</h4>
                                    <button onclick="deleteItem('plan', '${item.id}')" class="text-mutedFg hover:text-red-500 shrink-0"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                                ${item.loc ? `<div class="text-sm font-medium text-fg/80 mt-1 truncate"><i class="fa-regular fa-map mr-1"></i>${item.loc}</div>` : ''}
                                ${mapLink}
                            </div>
                        </div>
                    </div>
                `;
				});

				if (appState.plan.length === 0) {
					html += `<div class="ml-14 text-center text-mutedFg py-10 font-bold border-2 border-dashed border-border rounded-xl bg-white/50">目前還沒有行程喔！<br>趕快新增吧 ✨</div>`;
				}
				html += `</div>`;
				return html;
			}

			function renderGuide() {
				let html = `
                <div class="mb-6 flex justify-between items-end animate-[popIn_0.3s_ease-out]">
                    <h2 class="font-display font-extrabold text-4xl text-fg uppercase tracking-tight">Guide <span class="block text-secondary text-lg -mt-1">深度導覽</span></h2>
                    <div class="w-12 h-12 bg-secondary rounded-full flex items-center justify-center shadow-pop transform -rotate-12">
                        <i class="fa-solid fa-book-open text-white text-xl"></i>
                    </div>
                </div>

                <div class="sticker-card !bg-stripes blob-radius-3 animate-[popIn_0.4s_ease-out]">
                    <div class="bg-white p-4 rounded-xl border-2 border-fg">
                        <h3 class="font-display font-bold text-lg mb-3 flex items-center gap-2"><i class="fa-solid fa-pen-nib text-accent"></i> 撰寫景點介紹</h3>
                        <form id="form-guide" class="flex flex-col gap-1">
                            <div>
                                <label class="label-candy">景點名稱</label>
                                <input type="text" id="guide-title" class="input-candy" required>
                            </div>
                            <div>
                                <label class="label-candy">介紹、歷史背景或冷知識</label>
                                <textarea id="guide-desc" class="input-candy h-28 resize-none" required></textarea>
                            </div>
                            <div>
                                <label class="label-candy">OSM 地圖嵌入代碼 (選填)</label>
                                <input type="text" id="guide-embed" class="input-candy text-xs font-mono" placeholder="<iframe src='https://www.openstreetmap.org/...'>">
                            </div>
                            <button type="submit" class="candy-btn w-full !bg-secondary"><i class="fa-solid fa-check"></i> 新增雜誌頁</button>
                        </form>
                    </div>
                </div>
                
                <div class="flex flex-col gap-8 mt-8">
            `;

				appState.guide.forEach((item, index) => {
					let iframeHtml = '';
					if (item.embedUrl && item.embedUrl.includes('<iframe')) {
						const srcMatch = item.embedUrl.match(/src="([^"]+)"/);
						if (srcMatch) {
							iframeHtml = `<div class="w-full h-56 border-2 border-fg rounded-xl overflow-hidden mt-4 shadow-pop relative z-10 bg-muted"><iframe src="${srcMatch[1]}" width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"></iframe></div>`;
						}
					}

					html += `
                    <div class="bg-white border-2 border-fg rounded-2xl p-6 shadow-sticker relative overflow-hidden animate-[popIn_0.4s_ease-out]" style="animation-delay: ${index * 0.1}s">
                        <!-- Decorative shapes -->
                        <div class="absolute -right-8 -top-8 w-32 h-32 bg-quaternary/20 rounded-full z-0"></div>
                        <div class="absolute -left-4 -bottom-4 w-20 h-20 bg-tertiary/20 transform rotate-45 z-0"></div>
                        
                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-4 border-b-4 border-fg pb-3">
                                <h3 class="font-display font-extrabold text-3xl text-fg leading-none">${item.title}</h3>
                                <button onclick="deleteItem('guide', '${item.id}')" class="w-8 h-8 bg-white rounded-full border-2 border-fg shadow-[2px_2px_0px_#1E293B] flex items-center justify-center text-mutedFg hover:text-red-500 hover:bg-red-50 transition-colors shrink-0"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <div class="font-sans text-fg/90 font-medium leading-loose text-justify whitespace-pre-wrap text-lg">${item.desc}</div>
                            ${iframeHtml}
                        </div>
                    </div>
                `;
				});
				if (appState.guide.length === 0)
					html += `<div class="text-center text-mutedFg py-12 font-bold border-2 border-dashed border-border rounded-xl">尚無導覽資料。<br>像編輯雜誌一樣，寫下景點故事吧！</div>`;
				html += `</div>`;
				return html;
			}

			function renderWallet() {
				let totalTWD = appState.wallet.expenses.reduce(
					(acc, curr) => acc + parseFloat(curr.twd),
					0,
				);

				let html = `
                <div class="mb-6 flex justify-between items-end animate-[popIn_0.3s_ease-out]">
                    <h2 class="font-display font-extrabold text-4xl text-fg uppercase tracking-tight">Wallet <span class="block text-quaternary text-lg -mt-1">記帳匯率</span></h2>
                    <div class="w-12 h-12 bg-quaternary rounded-full flex items-center justify-center shadow-pop transform rotate-12">
                        <i class="fa-solid fa-coins text-white text-xl"></i>
                    </div>
                </div>

                <!-- Rate & Calculator Tool -->
                <div class="bg-fg text-white border-2 border-fg rounded-2xl p-5 shadow-pop mb-6 relative overflow-hidden animate-[popIn_0.4s_ease-out]">

			function renderNav() {
				const tabs = [
					{ id: 'PLAN', icon: 'fa-map-location-dot', color: 'accent' },
					{ id: 'GUIDE', icon: 'fa-book-open', color: 'secondary' },
					{ id: 'WALLET', icon: 'fa-wallet', color: 'quaternary' },
					{ id: 'LISTS', icon: 'fa-list-check', color: 'tertiary' },
					{ id: 'INFO', icon: 'fa-circle-info', color: 'fg' },
					{ id: 'SHOP', icon: 'fa-bag-shopping', color: 'secondary' },
				];

				const navContainer = document.getElementById('nav-container');
				navContainer.innerHTML = tabs
					.map((tab) => {
						const isActive = currentTab === tab.id;
						//                // 若背景為黃色 (tertiary)，使用深色字體以確保對比度清晰
						const activeTextColor =
							tab.color === 'tertiary' ? 'text-fg' : 'text-white';
						const activeClasses = `w-[50px] h-[50px] bg-${tab.color} ${activeTextColor} border-2 border-fg rounded-full scale-110 rotate-[5deg]`;
						const inactiveClasses = `w-14 h-14 text-mutedFg hover:bg-muted rounded-2xl`;

						return `
                    <button onclick="switchTab('${tab.id}')" class="flex flex-col items-center justify-center shrink-0 transition-all duration-300 ${isActive ? activeClasses : inactiveClasses}">
                        <div class="mb-0.5">
                            <i class="fa-solid ${tab.icon} text-lg"></i>
                        </div>
                        <span class="text-[9px] font-extrabold tracking-wider font-display uppercase">${tab.id}</span>
                    </button>
                `;
					})
					.join('');
			}

			function switchTab(tabId) {
				currentTab = tabId;
				const content = document.getElementById('app-content');

				// Simple fade transition
				content.style.opacity = 0;
				setTimeout(() => {
					switch (tabId) {
						case 'PLAN':
							content.innerHTML = renderPlan();
							break;
						case 'GUIDE':
							content.innerHTML = renderGuide();
							break;
						case 'WALLET':
							content.innerHTML = renderWallet();
							break;
						case 'LISTS':
							content.innerHTML = renderLists();
							break;
						case 'INFO':
							content.innerHTML = renderInfo();
							break;
						case 'SHOP':
							content.innerHTML = renderShop();
							break;
					}
					attachEvents(tabId);
					renderNav();
					window.scrollTo(0, 0);
					content.style.opacity = 1;
				}, 150); // Matches opacity transition duration (added in CSS via tailwind inline isn't needed if we use simple inline style below)
			}

			// Modal image viewer global function
			window.viewImage = function (src) {
				document.getElementById('modal-image-view').src = src;
				document.getElementById('modal-image').classList.remove('hidden');
				document.getElementById('modal-image').classList.add('flex');
			};

			window.deleteItem = function (path, id) {
				if (confirm('確定要刪除這個項目嗎？')) {
					if (path === 'plan')
						appState.plan = appState.plan.filter((i) => i.id !== id);
					else if (path === 'guide')
						appState.guide = appState.guide.filter((i) => i.id !== id);
					else if (path === 'wallet.expenses')
						appState.wallet.expenses = appState.wallet.expenses.filter(
							(i) => i.id !== id,
						);
					else if (path === 'lists.checklist')
						appState.lists.checklist = appState.lists.checklist.filter(
							(i) => i.id !== id,
						);
					else if (path === 'lists.memos')
						appState.lists.memos = appState.lists.memos.filter(
							(i) => i.id !== id,
						);
					else if (path === 'shop.items')
						appState.shop.items = appState.shop.items.filter(
							(i) => i.id !== id,
						);

					saveState();
					switchTab(currentTab);
				}
			};

			window.toggleChecklist = function (id, status) {
				const item = appState.lists.checklist.find((i) => i.id === id);
				if (item) {
					item.done = status;
					saveState();
					switchTab(currentTab);
				}
			};

			function attachEvents(tabId) {
				if (tabId === 'PLAN') {
					document
						.getElementById('form-plan')
						.addEventListener('submit', (e) => {
							e.preventDefault();
							appState.plan.push({
								id: generateId(),
								date: document.getElementById('plan-date').value,
								time: document.getElementById('plan-time').value,
								title: document.getElementById('plan-title').value,
								loc: document.getElementById('plan-loc').value,
								important: document.getElementById('plan-important').checked,
							});
							saveState();
							switchTab(currentTab);
						});
				} else if (tabId === 'GUIDE') {
					document
						.getElementById('form-guide')
						.addEventListener('submit', (e) => {
							e.preventDefault();
							appState.guide.push({
								id: generateId(),
								title: document.getElementById('guide-title').value,
								desc: document.getElementById('guide-desc').value,
								embedUrl: document.getElementById('guide-embed').value,
							});
							saveState();
							switchTab(currentTab);
						});
				} else if (tabId === 'WALLET') {
					const rateInput = document.getElementById('wallet-rate');
					rateInput.addEventListener('change', (e) => {
						appState.wallet.rate = parseFloat(e.target.value) || 0.21;
						saveState();
					});

					const calcBtn = document.getElementById('btn-calc');
					const calcInput = document.getElementById('wallet-calc-input');
					const calcResult = document.getElementById('wallet-calc-result');

					const doCalc = () => {
						const jpyVal = evaluateMath(calcInput.value);
						const twdVal = jpyVal * appState.wallet.rate;
						calcResult.textContent = Math.round(twdVal).toLocaleString();
					};
					calcBtn.addEventListener('click', doCalc);
					calcInput.addEventListener('keypress', (e) => {
						if (e.key === 'Enter') doCalc();
					});

					document
						.getElementById('form-expense')
						.addEventListener('submit', (e) => {
							e.preventDefault();
							const fileInput = document.getElementById('exp-img');
							const jpyAmt =
								evaluateMath(document.getElementById('exp-jpy').value) ||
								parseFloat(document.getElementById('exp-jpy').value) ||
								0;
							const twdAmt = jpyAmt * appState.wallet.rate;

							const saveExpense = (imgBase64) => {
								appState.wallet.expenses.push({
									id: generateId(),
									date: document.getElementById('exp-date').value,
									payer: document.getElementById('exp-payer').value,
									item: document.getElementById('exp-item').value,
									jpy: jpyAmt,
									twd: twdAmt,
									img: imgBase64,
								});
								saveState();
								switchTab(currentTab);
							};

							if (fileInput.files && fileInput.files[0])
								compressImage(fileInput.files[0], saveExpense);
							else saveExpense(null);
						});
				} else if (tabId === 'LISTS') {
					document
						.getElementById('form-checklist')
						.addEventListener('submit', (e) => {
							e.preventDefault();
							appState.lists.checklist.push({
								id: generateId(),
								text: document.getElementById('check-text').value,
								done: false,
							});
							saveState();
							switchTab(currentTab);
						});

					document
						.getElementById('form-memo')
						.addEventListener('submit', (e) => {
							e.preventDefault();
							appState.lists.memos.push({
								id: generateId(),
								text: document.getElementById('memo-text').value,
							});
							saveState();
							switchTab(currentTab);
						});
				} else if (tabId === 'INFO') {
					const btnEdit = document.getElementById('btn-edit-info');
					const btnSave = document.getElementById('btn-save-info');
					const displayArea = document.getElementById('info-display');
					const editAreaCont = document.getElementById('info-edit-container');
					const editArea = document.getElementById('info-edit');

					btnEdit.addEventListener('click', () => {
						displayArea.classList.add('hidden');
						editAreaCont.classList.remove('hidden');
						btnEdit.classList.add('hidden');
						editArea.focus();
					});

					btnSave.addEventListener('click', () => {
						appState.info.notes = editArea.value;
						saveState();
						displayArea.textContent = editArea.value;
						editAreaCont.classList.add('hidden');
						displayArea.classList.remove('hidden');
						btnEdit.classList.remove('hidden');
					});
				} else if (tabId === 'SHOP') {
					document
						.getElementById('form-shop')
						.addEventListener('submit', (e) => {
							e.preventDefault();
							const prodFile = document.getElementById('shop-img').files[0];
							const couponFile =
								document.getElementById('shop-coupon').files[0];
							const category = document.getElementById('shop-cat').value;

							// Add new category if it doesn't exist
							if (!appState.shop.categories.includes(category)) {
								appState.shop.categories.push(category);
							}

							const finalizeSave = (prodImg, couponImg) => {
								appState.shop.items.push({
									id: generateId(),
									name: document.getElementById('shop-name').value,
									cat: category,
									img: prodImg,
									couponImg: couponImg,
								});
								saveState();
								switchTab(currentTab);
							};

							// Handle double image compression
							if (prodFile && couponFile) {
								compressImage(prodFile, (pImg) => {
									compressImage(couponFile, (cImg) => finalizeSave(pImg, cImg));
								});
							} else if (prodFile) {
								compressImage(prodFile, (pImg) => finalizeSave(pImg, null));
							} else if (couponFile) {
								compressImage(couponFile, (cImg) => finalizeSave(null, cImg));
							} else {
								finalizeSave(null, null);
							}
						});
				}
			}

			const dataModal = document.getElementById('modal-data');
			const contentArea = document.getElementById('app-content');
			contentArea.style.transition = 'opacity 0.15s ease-in-out';

			document
				.getElementById('btn-data-modal')
				.addEventListener('click', () => {
					dataModal.classList.remove('hidden');
					dataModal.classList.add('flex');
					// Tiny timeout to allow display:flex to apply before setting opacity for transition
					setTimeout(() => {
						dataModal.style.opacity = 1;
					}, 10);
				});

			document
				.getElementById('btn-close-modal')
				.addEventListener('click', () => {
					dataModal.classList.add('hidden');
					dataModal.classList.remove('flex');
				});

			document.getElementById('btn-export').addEventListener('click', () => {
				const dataStr = JSON.stringify(appState);
				const blob = new Blob([dataStr], { type: 'application/json' });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = `WanderPop_Backup_${new Date().toISOString().slice(0, 10)}.json`;
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				URL.revokeObjectURL(url);
			});

			document
				.getElementById('input-import')
				.addEventListener('change', (e) => {
					const file = e.target.files[0];
					if (!file) return;
					const reader = new FileReader();
					reader.onload = (e) => {
						try {
							const importedData = JSON.parse(e.target.result);
							if (importedData && typeof importedData === 'object') {
								appState = { ...defaultState, ...importedData };
								saveState();
								alert('🎉 資料還原成功！');
								dataModal.classList.add('hidden');
								switchTab(currentTab);
							}
						} catch (err) {
							alert(
								'❌ 檔案格式錯誤，請確認這是之前 WanderPop 匯出的 JSON 檔案。',
							);
						}
					};
					reader.readAsText(file);
				});

			document.getElementById('btn-clear').addEventListener('click', () => {
				if (
					confirm(
						'⚠️ 警告：這將會永久清除這台手機上所有的行程、記帳與清單資料！確定要繼續嗎？',
					)
				) {
					if (
						confirm(
							'再次確認：清除後無法復原（除非您有備份過 JSON），確定清除？',
						)
					) {
						appState = JSON.parse(JSON.stringify(defaultState));
						saveState();
						dataModal.classList.add('hidden');
						switchTab('PLAN');
					}
				}
			});

			// Add CSS Animation Keyframes dynamically
			const styleSheet = document.createElement('style');
			styleSheet.textContent = `
            @keyframes popIn {
                0% { opacity: 0; transform: scale(0.95) translateY(10px); }
                70% { transform: scale(1.02) translateY(-2px); }
                100% { opacity: 1; transform: scale(1) translateY(0); }
            }
        `;
			document.head.appendChild(styleSheet);

			// Initialize App
			document.addEventListener('DOMContentLoaded', () => {
				switchTab('PLAN');
			});
		</script>
	</body>
</html>
